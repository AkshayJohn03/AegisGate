[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegisgate"
version = "0.1.0"
description = "AegisGate: a self-healing LLM gateway and control plane with budget-aware routing, semantic caching, and doc drift repair."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Akshay John Xavier" }]
keywords = ["llm", "gateway", "circuit-breaker", "semantic-cache", "cost-control"]
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "pyyaml>=6",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/aegisgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["aegisgate"]
