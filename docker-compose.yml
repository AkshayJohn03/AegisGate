# Production topology: gateway + shared Redis (rate limits, budgets) + Langfuse
# (trace observability). The gateway runs with in-memory stores when Redis is
# absent — compose is the multi-instance path, not a requirement.
services:
  aegisgate:
    build: .
    ports:
      - "8080:8080"
    environment:
      AEGISGATE_RATELIMIT_STORE: redis
      AEGISGATE_REDIS_URL: redis://redis:6379/0
      AEGISGATE_LLM_MODE: mock
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/langfuse
      NEXTAUTH_SECRET: changeme-in-production
      SALT: changeme-in-production
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langfuse
    restart: unless-stopped
